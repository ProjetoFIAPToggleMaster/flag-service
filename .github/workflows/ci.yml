name: CI - flag-service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Permite disparar o pipeline manualmente pelo botao "Run workflow"
  # na aba Actions, sem precisar de um commit novo.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: flag-service

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: flags_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flags_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flags_db
      AUTH_SERVICE_URL: http://localhost:8001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Carregar schema do banco
        run: psql "$DATABASE_URL" -f db/init.sql

      - name: Rodar testes (pytest)
        run: pytest

  
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar flake8
        run: pip install flake8==7.1.1

      - name: Erros que bloqueiam (sintaxe / nomes indefinidos)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Relatório de estilo (informativo, não bloqueia)
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar bandit
        run: pip install bandit==1.7.10

      - name: Relatório completo (informativo)
        run: bandit -r . -x ./tests,./.venv -f txt || true

      - name: Gate de segurança (falha em HIGH severity / HIGH confidence)
        run: bandit -r . -x ./tests,./.venv --severity-level high --confidence-level high

  
  sca:
    name: SCA (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Relatório de dependências (HIGH + CRITICAL, informativo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

      - name: Gate de segurança (falha em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  
  docker:
    name: Docker Build & Container Scan
    runs-on: ubuntu-latest
    needs: [build-test, lint, sast, sca]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Container scan - relatório (HIGH + CRITICAL, informativo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

      - name: Container scan - gate (falha em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  push-ecr:
    name: Push to AWS ECR
    runs-on: ubuntu-latest
    needs: [docker]
    # Publicação só a partir da main: rodar em PR entregaria credenciais AWS
    # a código ainda não revisado, vindo de qualquer branch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir SHA curto
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Sem aws-session-token: a conta usa um usuário IAM comum, com
      # credenciais de longa duração. Session token só existe em credenciais
      # temporárias (AWS Academy / SSO / role assumida).
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Uma única tag imutável v1.0.0-<sha>. A tag "latest" foi removida: o
      # repositório ECR é criado com IMMUTABLE, então o segundo push de
      # "latest" seria rejeitado pelo registry.
      - name: Build, tag e push da imagem
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
        run: |
          docker build -t "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" .
          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Imagem publicada: ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      # -----------------------------------------------------------------
      # GitOps: atualiza a tag no repo raiz; o ArgoCD sincroniza sozinho
      # -----------------------------------------------------------------
      # Precisa do secret GITOPS_PAT: o GITHUB_TOKEN deste repositório só
      # tem permissão sobre ele mesmo, não sobre o repo raiz.
      # 'ref: master' porque o repo raiz usa master (os serviços usam main).
      - name: Checkout do repo GitOps
        uses: actions/checkout@v4
        with:
          repository: ProjetoFIAPToggleMaster/toggle-master-microservices
          ref: master
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Atualizar a tag da imagem no repo GitOps
        env:
          IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
        run: |
          cd gitops-repo
          sed -i -E "s|(image: .*/${IMAGE_NAME}):.*|\1:${IMAGE_TAG}|" k8s/overlays/prod/patch-images.yaml

          # Reexecutar o mesmo commit não muda nada no arquivo, e um
          # 'git commit' sem alterações falharia — então saímos antes.
          if git diff --quiet; then
            echo "patch-images.yaml já aponta para ${IMAGE_TAG}; nada a fazer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(${IMAGE_NAME}): imagem ${IMAGE_TAG}"
          git push origin master
